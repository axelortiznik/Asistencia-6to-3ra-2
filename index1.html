<!DOCTYPE html>
<html lang="es">

    <link rel="stylesheet" href="appviews.css">
</head>
<body>

<div class="container">
    <h2>Asistencia 6to 3ra</h2>
    
    <form id="attendanceForm">
        <div class="form-group">
            <label for="studentName">Seleccioná tu Nombre:</label>
            <select id="studentName" required>
                <option value="" disabled selected>Elegí tu nombre...</option>
                <option value="Paredes Jose Carlos">Paredes Jose Carlos</option>
                <option value="Molfino Manuel">Molfino Manuel</option>
                <option value="Alanoca Yamil">Alanoca Yamil</option>
                <option value="Ortiz Axel">Ortiz Axel</option>
                <option value="Bonahora Diego">Bonahora Diego</option>
                <option value="Maguicha Franco">Maguicha Franco</option>
                <option value="Freiheit Ezequiel">Freiheit Ezequiel</option>
                <option value="Quiroz Ariel">Quiroz Ariel</option>
                <option value="Ojeda Joaquin">Ojeda Joaquin</option>
                <option value="Centurion Antonella">Centurion Antonella</option>
                <option value="Santa Cruz Tomas">Santa Cruz Tomas</option>
                <option value="Arias Ruben">Arias Ruben</option>
                <option value="Gonzalez Dylan">Gonzalez Dylan</option>
                <option value="Vesque Lautaro">Vesque Lautaro</option>
                <option value="Galvan Nahuel">Galvan Nahuel</option>
                <option value="Parodi Alexis">Parodi Alexis</option>
                <option value="Tabarez Axel">Tabarez Axel</option>
            </select>
        </div>

        <div class="form-group">
            <label for="pcNumber">Número de PC donde estás sentado:</label>
            <input type="number" id="pcNumber" min="1" max="30" placeholder="Ej: 12" required>
        </div>

        <div class="form-group">
            <label for="validationCode">Código de Aula (Mirá el pizarrón):</label>
            <input type="text" id="validationCode" placeholder="Ingresá el código de hoy" required>
        </div>

        <button type="submit" id="btnSubmit">Registrar Presente</button>
    </form>

    <div id="responseMessage" class="message"></div>
</div>
<script src="appjava.js"></script>
</body>
</html>
